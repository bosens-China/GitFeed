appId: com.yliu.gitfeed
productName: GitFeed
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!{.agents,.github,docs,tests}{,/**/*}'
  - '!{coverage,dist}{,/**/*}'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{pnpm-workspace.yaml,skills-lock.json,tsconfig.json,tsconfig.node.json,tsconfig.web.json,uno.config.ts,vitest.config.ts}'
asarUnpack:
  - resources/**
win:
  executableName: gitfeed
nsis:
  artifactName: ${name}-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  syncDesktopName: true
  target:
    - AppImage
    - deb
  maintainer: yliu
  category: Utility
npmRebuild: false
publish:
  provider: github
  owner: bosens-China
  repo: GitFeed
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
