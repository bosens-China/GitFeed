name: CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint

  release-please:
    name: Release Please
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  package:
    name: Package ${{ matrix.platform }}
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    needs: [quality, release-please]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            command: pnpm run build && pnpm exec electron-builder --mac --arm64
            artifacts: dist/*.dmg dist/*.zip
            artifact_paths: |-
              dist/*.dmg
              dist/*.zip
          - platform: Windows
            os: windows-latest
            command: pnpm run build && pnpm exec electron-builder --win --x64
            artifacts: dist/*.exe
            artifact_paths: dist/*.exe
          - platform: Linux
            os: ubuntu-latest
            command: pnpm run build && pnpm exec electron-builder --linux --x64
            artifacts: dist/*.AppImage dist/*.deb
            artifact_paths: |-
              dist/*.AppImage
              dist/*.deb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload release assets
        if: needs.release-please.outputs.release_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" ${{ matrix.artifacts }} --clobber
      - name: Upload verification packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: GitFeed-${{ matrix.platform }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
